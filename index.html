<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>デジタル会員証</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-2xl">
    
    <!-- ログイン / 新規登録フォーム -->
    <div id="authForms">
      <div class="flex justify-center gap-4 mb-6 text-sm font-bold border-b border-slate-700 pb-2">
        <button id="btnLoginTab" onclick="toggleAuthMode('login')" class="text-amber-400 border-b-2 border-amber-400 pb-1">ログイン</button>
        <button id="btnRegTab" onclick="toggleAuthMode('reg')" class="text-slate-400 pb-1">新規会員登録</button>
      </div>

      <div class="space-y-3">
        <div id="nameField" class="hidden">
          <label class="block text-xs text-slate-400 mb-1">ニックネーム</label>
          <input type="text" id="regName" placeholder="例: やまだ" class="w-full bg-slate-700 border border-slate-600 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-400">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">会員ID (英数字)</label>
          <input type="text" id="authId" placeholder="例: user01" class="w-full bg-slate-700 border border-slate-600 rounded-xl p-3 text-sm font-mono focus:outline-none focus:border-amber-400">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">パスワード</label>
          <input type="password" id="authPass" placeholder="••••••••" class="w-full bg-slate-700 border border-slate-600 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-400">
        </div>

        <!-- お気に入りキャスト選択欄 -->
        <div id="castSelectField" class="hidden">
          <label class="block text-xs text-slate-400 mb-1">お気に入りキャスト</label>
          <select id="regCast" class="w-full bg-slate-700 border border-slate-600 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-400 text-slate-100">
            <!-- JavaScriptで動的追加 -->
          </select>
        </div>

        <button id="authSubmitBtn" onclick="handleAuth()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold py-3 rounded-xl text-sm transition mt-4 flex justify-center items-center gap-2">
          <span id="authBtnText">ログイン</span>
          <i id="authSpinner" class="fa-solid fa-spinner fa-spin hidden"></i>
        </button>
      </div>
    </div>

    <!-- ログイン後：マイページ -->
    <div id="myPage" class="hidden space-y-6 text-center">
      
      <!-- キャスト画像・店舗ロゴ連動型 デジタル会員証 -->
      <div id="memberCard" class="relative rounded-2xl p-6 text-white shadow-2xl text-left overflow-hidden bg-no-repeat bg-top bg-cover transition-all duration-500 min-h-[220px] flex flex-col justify-between border border-slate-600/50">
        <!-- 視認性向上のための黒グラデーション -->
        <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/50 to-black/30"></div>

        <div class="relative z-10">
          <div class="flex justify-between items-start">
            <p class="text-[10px] text-amber-300 uppercase tracking-widest font-semibold drop-shadow">MEMBER CARD</p>
            <span id="castBadge" class="text-xs bg-amber-400/90 backdrop-blur-sm px-2.5 py-0.5 rounded-full text-slate-900 font-bold shadow">--</span>
          </div>
          <h2 id="dispName" class="text-2xl font-bold mt-2 drop-shadow-md">--</h2>
          <p id="dispId" class="text-xs font-mono text-slate-300 mt-0.5 drop-shadow">ID: --</p>
        </div>
        
        <div class="relative z-10 mt-6 pt-4 border-t border-white/20 flex justify-between items-end">
          <div>
            <p class="text-[10px] text-slate-300 uppercase tracking-wider">現在の所持ポイント</p>
            <p class="text-4xl font-extrabold mt-1 drop-shadow"><span id="dispPoints">0</span> <span class="text-sm font-normal">pt</span></p>
          </div>
          <button onclick="refreshPoints()" class="bg-black/50 hover:bg-black/70 p-2.5 rounded-xl text-xs transition flex items-center gap-1.5 backdrop-blur-md border border-white/10">
            <i class="fa-solid fa-rotate-right" id="refreshIcon"></i> 更新
          </button>
        </div>
      </div>

      <!-- 推しキャスト変更メニュー -->
      <div class="bg-slate-700/50 p-3 rounded-xl flex items-center justify-between text-xs border border-slate-600/40">
        <span class="text-slate-300 font-bold">推しキャスト変更:</span>
        <select id="changeCastSelect" onchange="changeCast(this.value)" class="bg-slate-700 border border-slate-600 rounded-lg px-2 py-1.5 text-slate-100 focus:outline-none">
          <!-- JavaScriptで動的追加 -->
        </select>
      </div>

      <button onclick="logout()" class="block w-full text-center text-xs text-slate-400 hover:text-slate-200 pt-2">
        ログアウト
      </button>
    </div>

  </div>

  <!-- casts.js の読み込み -->
  <script src="casts.js"></script>

  <script>
    // 指定されたWebアプリURLを埋め込み
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwJTmkOPsib9TX9qG6f7jdeBrhH8BaY0_xOj_1ye7FsU2IFoUGSL5EmaoH2tejKuDYp/exec";

    // 推しがいない場合（店舗ロゴ）のデフォルト定義
    const NONE_CAST = { id: "none", name: "指定なし（箱推し）", image: "logo.jpeg" };

    // casts.js が読み込めなかった場合のフォールバック
    const defaultCastMembers = [
      { id: "cast-yuinya", name: "ゆいにゃ", image: "ゆ.jpeg" },
      { id: "cast-fuchan", name: "ふちゃん", image: "ふちゃん.jpeg" },
      { id: "cast-hime", name: "ひめ", image: "ひめ.jpeg" },
      { id: "cast-syuka", name: "しゅか", image: "しゅか.jpeg" },
      { id: "cast-yuriru", name: "ゆりる", image: "ゆりる.jpeg" },
      { id: "cast-kaede", name: "楓", image: "楓.jpeg" },
      { id: "cast-rei", name: "れい", image: "れい.jpeg" },
      { id: "cast-binetsu", name: "微熱", image: "微熱.jpeg" },
      { id: "cast-yayoi", name: "やよい", image: "j.png" }
    ];

    const activeCasts = (typeof castMembers !== 'undefined') ? castMembers : defaultCastMembers;

    let authMode = 'login';
    let currentUser = null;

    document.addEventListener('DOMContentLoaded', () => {
      initCastSelects();
    });

    function initCastSelects() {
      const regSelect = document.getElementById('regCast');
      const changeSelect = document.getElementById('changeCastSelect');

      regSelect.innerHTML = '';
      changeSelect.innerHTML = '';

      // プルダウンの先頭に「指定なし（箱推し）」を追加
      const allOptions = [NONE_CAST, ...activeCasts];

      allOptions.forEach(cast => {
        const isNone = cast.id === 'none';
        const labelText = isNone ? `✨ ${cast.name}` : `💖 ${cast.name}`;

        const opt1 = document.createElement('option');
        opt1.value = cast.id;
        opt1.textContent = labelText;
        regSelect.appendChild(opt1);

        const opt2 = document.createElement('option');
        opt2.value = cast.id;
        opt2.textContent = labelText;
        changeSelect.appendChild(opt2);
      });
    }

    function toggleAuthMode(mode) {
      authMode = mode;
      if(mode === 'login') {
        document.getElementById('nameField').classList.add('hidden');
        document.getElementById('castSelectField').classList.add('hidden');
        document.getElementById('btnLoginTab').className = "text-amber-400 border-b-2 border-amber-400 pb-1";
        document.getElementById('btnRegTab').className = "text-slate-400 pb-1";
        document.getElementById('authBtnText').innerText = "ログイン";
      } else {
        document.getElementById('nameField').classList.remove('hidden');
        document.getElementById('castSelectField').classList.remove('hidden');
        document.getElementById('btnRegTab').className = "text-amber-400 border-b-2 border-amber-400 pb-1";
        document.getElementById('btnLoginTab').className = "text-slate-400 pb-1";
        document.getElementById('authBtnText').innerText = "新規登録してマイページへ";
      }
    }

    async function handleAuth() {
      const id = document.getElementById('authId').value.trim();
      const password = document.getElementById('authPass').value.trim();
      const name = document.getElementById('regName').value.trim();
      const cast = document.getElementById('regCast').value;

      if(!id || !password) return alert('IDとパスワードを入力してください');
      if(authMode === 'reg' && !name) return alert('ニックネームを入力してください');

      setLoading(true);

      const payload = {
        action: authMode,
        id: id,
        password: password,
        name: name,
        cast: cast
      };

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if(data.status === 'success') {
          currentUser = {
            id: id,
            password: password,
            name: data.name || name,
            points: data.points || 0,
            cast: data.cast || cast || NONE_CAST.id
          };
          renderMyPage();
        } else {
          alert(data.message);
        }
      } catch(e) {
        alert('通信エラーが発生しました。');
      } finally {
        setLoading(false);
      }
    }

    function renderMyPage() {
      document.getElementById('authForms').classList.add('hidden');
      document.getElementById('myPage').classList.remove('hidden');
      document.getElementById('dispName').innerText = currentUser.name;
      document.getElementById('dispId').innerText = "ID: " + currentUser.id;
      document.getElementById('dispPoints').innerText = currentUser.points;

      updateCardDesign(currentUser.cast);
    }

    // カードデザインの更新（推しなしなら店舗ロゴを表示）
    function updateCardDesign(castId) {
      const card = document.getElementById('memberCard');
      const badge = document.getElementById('castBadge');
      
      const castInfo = activeCasts.find(c => c.id === castId) || NONE_CAST;

      if (castInfo.id === 'none') {
        // 店舗ロゴ表示時：中央寄せ & ロゴ全体が入るように調整
        card.style.backgroundImage = `url('${NONE_CAST.image}')`;
        card.style.backgroundPosition = 'center';
        card.style.backgroundSize = 'contain';
        badge.innerText = `✨ 箱推し`;
      } else {
        // キャスト写真表示時：上部（顔付近）を中心に拡大表示
        card.style.backgroundImage = `url('${castInfo.image}')`;
        card.style.backgroundPosition = 'top';
        card.style.backgroundSize = 'cover';
        badge.innerText = `💖 ${castInfo.name} 推し`;
      }

      document.getElementById('changeCastSelect').value = castInfo.id;
    }

    async function changeCast(newCastId) {
      if(!currentUser) return;
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'updateCast', id: currentUser.id, password: currentUser.password, cast: newCastId })
        });
        const data = await res.json();
        if(data.status === 'success') {
          currentUser.cast = newCastId;
          updateCardDesign(newCastId);
        }
      } catch(e) {
        alert('キャストの変更に失敗しました');
      }
    }

    async function refreshPoints() {
      if(!currentUser) return;
      const icon = document.getElementById('refreshIcon');
      icon.classList.add('fa-spin');

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'login', id: currentUser.id, password: currentUser.password })
        });
        const data = await res.json();
        if(data.status === 'success') {
          currentUser.points = data.points;
          currentUser.cast = data.cast || currentUser.cast;
          document.getElementById('dispPoints').innerText = data.points;
          updateCardDesign(currentUser.cast);
        }
      } catch(e) {
        alert('更新に失敗しました');
      } finally {
        icon.classList.remove('fa-spin');
      }
    }

    function logout() {
      currentUser = null;
      document.getElementById('myPage').classList.add('hidden');
      document.getElementById('authForms').classList.remove('hidden');
      document.getElementById('authPass').value = '';
    }

    function setLoading(isLoading) {
      const btnText = document.getElementById('authBtnText');
      const spinner = document.getElementById('authSpinner');
      if(isLoading) {
        btnText.classList.add('opacity-50');
        spinner.classList.remove('hidden');
      } else {
        btnText.classList.remove('opacity-50');
        spinner.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
